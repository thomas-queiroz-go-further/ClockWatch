version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres-clockwatch
    environment:
      - POSTGRES_USER=root
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=clockwatch_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - clockwatch-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-clockwatch
    environment:
      - PGADMIN_DEFAULT_EMAIL=thomasjml10@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=123456
    ports:
      - "54321:80"
    depends_on:
      - postgres
    networks:
      - clockwatch-network

volumes:
  postgres_data:
    driver: local

networks:
  clockwatch-network:
    driver: bridge
